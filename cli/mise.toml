[tools]
rust = "latest"

[tasks.lint]
description = "Lint the comonteur CLI crate (non-mutating)"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings"]

[tasks.autofix]
description = "Apply cargo fmt + clippy --fix"
run = ["cargo fmt", "cargo clippy --fix --allow-dirty --allow-staged"]

[tasks.test]
description = "Run cargo test"
run = "cargo test"
