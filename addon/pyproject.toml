[project]
name = "comonteur-addon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN"]  # ruff defaults (E/F) + isort + type annotations
ignore = ["ANN401"]  # bpy has no type stubs; Any is the honest type for its objects

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["ANN"]
