[tools]
ffmpeg = "latest"
# The comonteur:ingest_* and comonteur:reconcile tasks are `uv run --script` Python and
# declare their own dependencies inline, so uv is all they need — nothing is installed and
# nothing is compiled.
uv = "latest"

# Blender is deliberately not pinned here — install 5.2 LTS yourself
# (https://www.blender.org/download/lts/); `mise run comonteur:doctor` checks the version.
# Tasks live in mise-tasks/comonteur/, so this file stays yours to edit.
