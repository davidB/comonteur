# Shot title + the assembly — authoritative for the edit, silent about scene interiors.
# Validate/resolve with: mise run comonteur:reconcile   (then cmt.reconcile.apply() in Blender)
#
# A shot's position is an absolute `start` (frames) or an `anchor` — a transcript word,
# occurrence index and signed offset in seconds. Prefer anchors when there is a voiceover:
# re-recording the audio then only needs a re-transcribe, not a re-timed edit.
#
# Per shot: id (stable, matches shots/<id>.blend), title (required), and optionally
# target_duration (seconds, aspirational — distinct from the authoritative `duration` once a
# shot is built), vo (line of narration), broll (asset reference), notes (freeform markdown:
# comments, directives, links, pseudo-code — anything that doesn't need its own field).
# A shot with no `source` yet is a title-only stub — valid, just not assembled yet.
#
# This project — fill these in once, they orient everyone who opens the file:
#   video:      one line — what this video is and who it's for
#   voiceover:  none | human-recorded | TTS
#   brand:      lib/brand.blend — colours, fonts, node groups, marked as assets
fps = 30
resolution = [1920, 1080]
# notes = '''doc-level creative direction that doesn't belong to one shot — palette,
# motion grammar, negative list, distribution/publishing metadata, etc.'''

[[shots]]
id = "shot-01"
title = "Replace me — what this shot has to communicate, in one or two sentences."
target_duration = 3.0
source = {kind = "scene", blend = "shots/shot-01.blend", scene = "shot-01"}
start = 0
duration = 90
# notes = '''freeform: beat/persuasion/blueprint from a source storyboard, a reference
# link, a pseudo-code sketch — whatever helps the human or agent adjust this shot.'''

