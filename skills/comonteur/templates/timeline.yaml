# The assembly — authoritative for the edit, silent about scene interiors.
# Resolve with: mise run comonteur:reconcile   (then cmt.reconcile.apply() inside Blender)
#
# A shot's position is an absolute `start` (frames) or an `anchor` — a transcript word,
# occurrence index and signed offset in seconds. Prefer anchors when there is a voiceover:
# re-recording the audio then only needs a re-transcribe, not a re-timed edit.
fps: 30
resolution: [1920, 1080]

shots: []
#  - id: shot-01
#    source: {kind: scene, blend: compositions/frames/shot-01.blend, scene: shot-01}
#    start: 0
#    duration: 90
#  - id: shot-02
#    source: {kind: movie, path: assets/broll.mp4}
#    anchor: {word: "faster", occurrence: 1, offset: -0.2}
#    duration: 120
#    transition: {type: cross, duration: 0.4}

audio: []
