[tools]
uv = "latest"

[tasks.lint]
description = "Lint addon/ and tests/ with ruff (non-mutating)"
run = ["uv run ruff check addon tests", "uv run ruff format --check addon tests"]

[tasks.autofix]
description = "Apply ruff's autofixes and formatting to addon/ and tests/"
run = ["uv run ruff check --fix addon tests", "uv run ruff format addon tests"]

[tasks.test]
description = "Run pure-logic unit tests (pytest)"
run = "uv run pytest"

[tasks.ci]
description = "Lint + unit tests"
depends = ["lint", "test"]
