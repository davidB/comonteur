monorepo_root = true

# `release` (mise-tasks/release.py) is auto-discovered as a file task, not listed here.
# Release policy/version scheme: see mise-tasks/release.py.

[monorepo]
config_roots = ["addon", "tests"]

[tasks.lint]
description = "Run all Lint"
depends = ["//...:lint"]

[tasks.autofix]
description = "Run all autofix (and format)"
depends = ["//...:autofix"]

[tasks.test]
description = "run all test"
depends = ["//...:test"]

[tasks.ci]
description = "Lint + unit tests across addon/ and tests/ (all Python)"
depends = ["lint", "test"]
