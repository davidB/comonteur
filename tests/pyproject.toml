[project]
name = "comonteur-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# The task scripts declare no runtime dependencies (PEP 723 `dependencies = []`) — they are
# stdlib-only — so this group carries the test toolchain and nothing else.
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["unit"]

[tool.mypy]
# Scoped to the comonteur:* task scripts (see TASKS_DIR in mise.toml): that logic used to be
# Rust, so a typechecker replaces what the compiler was catching. The unit tests themselves
# are not checked — they reach the addon through sys.path, which mypy cannot follow at rest,
# and running them proves more than checking them would.
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN"]  # ruff defaults (E/F) + isort + type annotations
ignore = ["ANN401"]  # bpy has no type stubs; Any is the honest type for its objects
