[project]
name = "comonteur-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["unit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN"]  # ruff defaults (E/F) + isort + type annotations
ignore = ["ANN401"]  # bpy has no type stubs; Any is the honest type for its objects
